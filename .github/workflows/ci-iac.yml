name: CI / IaC

on:
  pull_request:
    branches: [dev, stg, prd]
    types: [opened, reopened, synchronize, edited]
    paths:
      - 'iac/**'
      - '.github/workflows/ci-iac.yml'

env:
  tf_version: "1.9.0" # must match value in iac/app/main.tf

jobs:
  env:
    name: Set Env Vars
    timeout-minutes: 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up DEV Environment Variables
        if: github.base_ref == 'dev'
        run: |
          matrix='{
            "env":[
              {
                "environment_name":"dev",
                "aws_account":"977306314792",
                "aws_gha_role":"hw-fargate-api-dev-gha"
              }
            ]
          }'
          echo matrix=`echo $matrix | jq -c .` >> $GITHUB_ENV

      - name: Set up STG Environment Variables
        if: github.base_ref == 'stg'
        run: |
          matrix='{
            "env":[
              {
                "environment_name":"stg",
                "aws_account":"977306314792",
                "aws_gha_role":"hw-fargate-api-stg-gha"
              }
            ]
          }'
          echo matrix=`echo $matrix | jq -c .` >> $GITHUB_ENV

      - name: Set up PRD/CPY Environment Variables
        if: github.base_ref == 'prd'
        run: |
          matrix='{
            "env":[
              {
                "environment_name":"prd",
                "aws_account":"539738229445",
                "aws_gha_role":"hw-fargate-api-prd-gha"
              },
              {
                "environment_name":"cpy",
                "aws_account":"539738229445",
                "aws_gha_role":"hw-fargate-api-cpy-gha"
              }
            ]
          }'
          echo matrix=`echo $matrix | jq -c .` >> $GITHUB_ENV

    outputs:
      matrix: ${{ env.matrix }}

  format:
    name: Tofu Format
    timeout-minutes: 3
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Tofu Setup
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.tf_version }}

      - name: Tofu Format
        working-directory: iac
        run: tofu fmt -check -recursive

  plan:
    name: Tofu Plan / ${{ matrix.env.environment_name }}
    timeout-minutes: 6
    runs-on: ubuntu-latest
    needs: env
    strategy:
      matrix: ${{ fromJson(needs.env.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: "arn:aws:iam::${{ matrix.env.aws_account }}:role/${{ matrix.env.aws_gha_role }}"
          role-session-name: ${{ github.sha }}
          aws-region: us-west-2

      - name: Tofu Setup
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.tf_version }}

      - name: Tofu Init
        working-directory: iac/app
        run: tofu init -var-file=${{ matrix.env.environment_name }}.tfvars

      - name: Tofu Plan
        working-directory: iac/app
        run: tofu plan -var-file=${{ matrix.env.environment_name }}.tfvars -var 'image_tag=ci_test' -input=false -out plan -lock=false

      - name: Comment Tofu Plan
        uses: byu-oit/github-action-tf-plan-comment@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: iac/app
          terraform-plan-file: plan

      - name: Render Tofu Plan as JSON
        working-directory: iac/app
        run: tofu show -json plan > plan.tfplan.json

      - name: Scan Tofu Plan with Trivy
        id: trivy-sarif
        uses: aquasecurity/trivy-action@v0.36.0
        # Keep the scan root at the repository root so SARIF paths are correct in GitHub Code Scanning.
        env:
          TRIVY_MISCONFIG_SCANNERS: terraformplan-json
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          format: sarif
          output: trivy-results-${{ matrix.env.environment_name }}.sarif
          exit-code: 0

      - name: Enforce High/Critical Trivy Findings
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_MISCONFIG_SCANNERS: terraformplan-json
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          skip-setup-trivy: true

      - name: Upload Trivy Results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.trivy-sarif.outcome != 'skipped'
        with:
          sarif_file: trivy-results-${{ matrix.env.environment_name }}.sarif
          category: trivy-terraform-${{ matrix.env.environment_name }}
          checkout_path: ${{ github.workspace }}
